<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>档案检索 | 静默回声声学档案馆</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="assets/img/logo.svg" alt="SESA Logo">
            <h1>静默回声声学档案馆</h1>
        </div>
        <p class="subtitle">虚构声音资料数字保存计划</p>
        <nav>
            <a href="index.html">首页</a>
            <a href="archive.html">档案检索</a>
            <a href="about.html">关于</a>
            <a href="contact.html">联系</a>
        </nav>
    </header>

    <main>
        <section class="search-box">
            <h2>档案检索</h2>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="输入关键词，例如：雨声、街道、广播">
                <button type="submit">检索</button>
            </form>
        </section>

        <section id="search-results">
            <h3>检索结果</h3>
            <p id="result-count">显示全部馆藏</p>
            <table id="results-table">
                <thead>
                    <tr>
                        <th>编号</th>
                        <th>标题</th>
                        <th>年份</th>
                        <th>时长</th>
                        <th>介质</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
        </section>

        <section id="anomaly-section" class="hidden">
            <p class="error-message">索引校验失败</p>
        </section>

        <p id="checksum-hint" class="faint-text clickable" style="display:none;">请验证会话完整性</p>
    </main>

    <footer>
        <p>&copy; 2009-2024 静默回声声学档案馆。保留所有权利。</p>
        <p class="disclaimer">本网站为虚构叙事作品，所有机构、人物与事件均为创作。</p>
    </footer>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/search.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
